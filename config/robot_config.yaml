# Nova 2 试管抓取项目 - 机器人/相机基础配置
# 说明：此处为占位配置，实际参数请在标定与联调后填写。
# 单位约定：长度统一 mm，角度统一 deg，图像尺寸 px。

robot:
  ip: "192.168.1.100"        # Nova 2 控制柜 IP（占位）
  port: 29999                # Dashboard 指令口（占位 IP，端口按 SDK 约定）
  feedback_port: 30004       # 反馈口；设为 null 可关闭反馈
  speed: 50                  # 默认运动速度百分比（占位）

gripper:
  type: "parallel"           # 夹爪类型（占位）
  open_width_mm: 40.0        # 张开宽度 mm（占位）
  close_width_mm: 10.0       # 闭合宽度 mm（占位）
  # 控制协议尚未确定：tool_do / dual_do / serial / unknown
  # unknown 模式下开合动作会抛 GripperError，is_grasped() 返回 UNKNOWN
  control_mode: "unknown"
  open_do_index: null        # 张开 DO 编号（tool_do 模式必填，占位）
  close_do_index: null       # 闭合 DO 编号（dual_do 模式必填，占位）
  do_active_level: 1         # DO 有效电平：1=ON，0=OFF
  feedback_di_index: null    # 夹持反馈 DI 编号；null 表示无反馈
  feedback_active_level: 1   # DI 反馈有效电平：1=ON，0=OFF
  feedback_timeout_s: 2.0    # 等待反馈超时 s（预留）
  tool_power_required: false # 开合前是否需要打开末端工具电源

camera:
  intrinsics_file: "config/camera_intrinsics.npz"
  width: 1280                # 图像宽度（占位）
  height: 720                # 图像高度（占位）

calibration:
  T_base_camera_file: "config/T_base_camera.npy"
  T_base_rack_file: "config/T_base_rack.npy"

task:
  tube_count: 3              # 连续任务试管数量（占位）
  approach_height_mm: 100.0  # 接近/抬升高度 mm（占位）
  insert_speed: 10           # 插入低速百分比（占位）
